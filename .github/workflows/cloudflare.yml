name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - run: deno task build

      - name: Export static pages (root path)
        env:
          BASE_PATH: ""
        run: deno task export

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler (from a clean folder)
        run: cd /tmp && npm install -g wrangler@3

      - name: Create Pages project (ignored if it exists)
        run: wrangler pages project create winter --production-branch=main || true

      - name: Deploy
        run: wrangler pages deploy dist --project-name=winter --branch=main
